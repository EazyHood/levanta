name: publish

# Publishes to PyPI with Trusted Publishing (no token stored in the repo).
# One-time setup on pypi.org: Your projects -> Publishing -> add a pending publisher
#   owner: EazyHood   repository: levanta   workflow: publish.yml   environment: pypi
# Then push a tag:  git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
